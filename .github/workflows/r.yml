name: R

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ["release"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install R dependencies
        run: install.packages("httr2", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Check R source
        run: |
          Rscript -e 'parse(file = "R/academic_review.R")'
          Rscript -e 'source("R/academic_review.R"); stopifnot(is.function(academic_review), is.function(academic_review_file))'
