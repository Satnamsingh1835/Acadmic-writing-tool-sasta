name: R

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ["release"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libuv1-dev

      - name: Install R dependencies
        run: |
          install.packages(
            c("httr2", "testthat"),
            repos = "https://cloud.r-project.org"
          )
        shell: Rscript {0}

      - name: Check R source
        run: |
          Rscript -e 'parse(file = "R/academic_review.R")'
          Rscript -e 'parse(file = "R/researcher_decisions.R")'
          Rscript -e 'parse(file = "R/workspace.R")'
          Rscript -e 'parse(file = "R/academic_workflow.R")'

      - name: Run R tests
        run: Rscript -e 'source("tests/testthat.R")'
