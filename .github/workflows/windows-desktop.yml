name: Windows desktop build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop, research and test dependencies
        run: python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build one-folder desktop distribution
        run: python -m PyInstaller --noconfirm --clean ScholarFlowDesktop.spec
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScholarFlow-Windows-onedir
          path: dist/ScholarFlow/
          if-no-files-found: error
          retention-days: 14
