name: Research Synthesist CI
on:
  push:
    branches: ["research-synthesist"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest flake8
      - name: Syntax and lint checks
        run: |
          python -m compileall agent workflows
          flake8 agent workflows tests/test_research_synthesist.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests
        run: pytest -q
